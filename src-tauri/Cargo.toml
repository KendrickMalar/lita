[package]
name = "lita"
version = "0.2.28"
description = "Lita writes your posts, in your voice, using the Codex login you already have."
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
# The `_lib` suffix keeps the library name distinct from the binary on Windows.
# See https://github.com/rust-lang/cargo/issues/8519
name = "lita_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
lita-auth = { path = "../crates/lita-auth" }
lita-engine = { path = "../crates/lita-engine" }
lita-sources = { path = "../crates/lita-sources" }
lita-store = { path = "../crates/lita-store" }
anyhow = "1"
reqwest = { version = "0.12", default-features = false }
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-process = "2.3.1"
fix-path-env = { git = "https://github.com/tauri-apps/fix-path-env-rs", version = "0.0.0" }

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-updater = "2.12.0"
