[workspace]
resolver = "3"
members = ["crates/*", "src-tauri"]

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/KendrickMalar/lita"

# Cargo only honours profiles at the workspace root. These are the settings
# Tauri recommends for a small binary: https://tauri.app/concept/size/
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
