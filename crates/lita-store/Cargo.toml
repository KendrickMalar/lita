[package]
name = "lita-store"
version = "0.0.0"
description = "Typed access to Lita's data on Supabase (PostgREST), always as the signed-in user."
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
anyhow = "1"
lita-engine = { path = "../lita-engine" }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"

[dev-dependencies]
lita-auth = { path = "../lita-auth" }
